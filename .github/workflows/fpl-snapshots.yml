name: Archive FPL predeadline snapshots

"on":
  workflow_dispatch: {}
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: write

concurrency:
  group: fpl-snapshots
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline pipeline smoke tests
        run: python -m unittest -v test_fpl_pipeline.py
      - name: Capture current FPL market and fixture state
        run: python fpl_snapshot.py
      - name: Freeze next-GW baseline predictions
        run: python fpl_forecast_baseline.py
      - name: Refresh latest publicly published entry squad
        run: python fpl_public_squad.py
      - name: Optimize personal starting XI and captain
        run: python fpl_lineup_optimizer.py
      - name: Compare hold versus one or two transfers
        run: python fpl_transfer_scenarios.py
      - name: Compare five-GW transfer outcomes
        run: python fpl_multiweek_transfers.py
      - name: Evaluate completed-GW frozen forecasts
        run: python fpl_forecast_evaluate.py
      - name: Audit lineup and transfer recommendations
        run: python fpl_recommendation_audit.py
      - name: Commit immutable daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/ data/forecasts/
          if [ -f data/picks.json ]; then git add data/picks.json; fi
          if [ -f data/squad_freshness.json ]; then git add data/squad_freshness.json; fi
          if [ -f data/recommendation_audit.json ]; then git add data/recommendation_audit.json; fi
          if [ -f data/multiweek_transfer_plan.json ]; then git add data/multiweek_transfer_plan.json; fi
          if [ -f data/transfer_scenarios.json ]; then git add data/transfer_scenarios.json; fi
          if [ -f data/lineup_recommendation.json ]; then git add data/lineup_recommendation.json; fi
          if [ -f data/forecast_evaluation.json ]; then git add data/forecast_evaluation.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Archive daily FPL market snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
