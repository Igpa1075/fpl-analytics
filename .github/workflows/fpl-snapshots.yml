name: Archive FPL predeadline snapshots

"on":
  workflow_dispatch: {}
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: write

concurrency:
  group: fpl-snapshots
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture current FPL market and fixture state
        run: python fpl_snapshot.py
      - name: Freeze next-GW baseline predictions
        run: python fpl_forecast_baseline.py
      - name: Commit immutable daily snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/ data/forecasts/
          if ! git diff --cached --quiet; then
            git commit -m "Archive daily FPL market snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
