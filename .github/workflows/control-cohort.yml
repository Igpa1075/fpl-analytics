name: Build FPL control cohort

"on":
  workflow_dispatch: {}
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

concurrency:
  group: fpl-control-cohort
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect random control cohort
        run: python fpl_control_cohort.py
      - name: Commit control cohort
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/control_cohort.json
          if ! git diff --cached --quiet; then
            git commit -m "Grow FPL control cohort"
            git pull --rebase
            git push
          fi
