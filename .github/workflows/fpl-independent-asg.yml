name: Independent GW1-10 ASG replay
on:
  push:
    paths:
      - fpl_independent_asg_replay.py
      - .github/workflows/fpl-independent-asg.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay independent GW1-10 team
        run: python -u fpl_independent_asg_replay.py
      - name: Commit replay result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/independent_gw1_10_asg_replay.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive independent ASG historical replay"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
