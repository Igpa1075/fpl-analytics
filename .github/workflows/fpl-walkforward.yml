name: Historical FPL walk-forward replay

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay fixed elite100 GW1-GW9 with past-only information
        run: python -u fpl_walkforward_backtest.py
      - name: Compare against actual elite100 starting XI and captain
        run: python -u fpl_walkforward_compare.py
      - name: Save reproducible historical replay
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historical_player_summaries.json data/walkforward_elite100_gw1_9.json data/walkforward_elite100_comparison.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Archive historical FPL forward-only replay"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
