
name: Update FPL data

"on":
  workflow_dispatch: {}
  schedule:
    - cron: '15 4 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test published-picks synchronization
        run: python -m unittest test_fpl_sync.py

      - name: Download FPL data
        run: python fpl_sync.py

      - name: Generate FPL analysis
        run: python fpl_analysis.py > data/analysis.txt
  
      - name: Generate personal team analysis
        run: python fpl_team.py > data/team_analysis.txt
  
      - name: Analyze friends mini-league
        run: python fpl_league.py > data/league_analysis.txt
  
      - name: Save mini-league history
        run: python fpl_league_history.py
  
      - name: Collect historical player match records
        run: python fpl_historical_players.py --limit 160

      - name: Validate historical player coverage
        run: python fpl_historical_coverage.py

      - name: Test historical feature leakage prevention
        run: python -m unittest test_fpl_backtest_features.py

      - name: Generate lagged backtest features
        run: python fpl_backtest_features.py

      - name: Validate scoring against actual FPL picks
        run: python fpl_backtest_validate_scoring.py

      - name: Test FPL autosubs and captain fallback
        run: python -m unittest test_fpl_backtest_autosubs.py

      - name: Test counterfactual starting XI rules
        run: python -m unittest test_fpl_backtest_hold_baseline.py

      - name: Run fixed-squad counterfactual baseline
        run: python fpl_backtest_hold_baseline.py

      - name: Run exploratory prior-form transfer simulation
        run: python fpl_backtest_exploratory_transfers.py

      - name: Audit transfer price evidence
        run: python fpl_backtest_transfer_price_audit.py

      - name: Diagnose transfer budget with fixture-price proxies
        run: python fpl_backtest_budget_proxy.py

      - name: Run budget-constrained proxy transfer backtest
        run: python fpl_backtest_budget_constrained_proxy.py

      - name: Decompose manager versus model scoring gap
        run: python fpl_backtest_manager_gap.py

      - name: Audit sensitivity to missing deadline prices
        run: python fpl_backtest_deadline_price_sensitivity.py

      - name: Cross-check historical prices against public GW archive
        run: python fpl_historical_price_archive_crosscheck.py

      - name: Audit historical backtest readiness
        run: python fpl_backtest_audit.py

      - name: Analyze transfer strategy
        run: python fpl_strategy.py > data/strategy_analysis.txt
  
      - name: Plan transfers
        run: python fpl_transfer_planner.py > data/transfer_plan.txt
  
      - name: Decide whether to transfer
        run: python fpl_decision.py > data/transfer_decision.txt
  
      - name: Evaluate starting XI transfer impact
        run: python fpl_lineup_value.py > data/lineup_value.txt

      - name: Forecast five gameweeks
        run: python fpl_five_gw.py > data/five_gw_plan.txt

      - name: Compare transfer strategies and tactical roles
        run: python fpl_strategy_roles.py > data/strategy_roles.txt

      - name: Audit real player roles
        run: python fpl_roles_audit.py > data/roles_audit.txt
      - name: Test API-Football connection
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python fpl_api_test.py
      - name: Test TheSportsDB free API
        run: python fpl_sportsdb_test.py
      - name: Test ESPN Premier League lineups
        run: python fpl_espn_test.py   
      - name: Collect recent ESPN lineups
        run: python fpl_espn_collect.py
      - name: Match ESPN players with FPL
        run: python fpl_espn_match.py
        
      - name: Match ESPN players with FPL V2
        run: python fpl_espn_match_v2.py

      - name: Audit ESPN data quality
        run: python fpl_espn_audit.py

      - name: Verify ESPN matches against FPL
        run: python fpl_fixture_verify.py

      - name: Verify ESPN matches using team IDs
        run: python fpl_fixture_verify_v2.py
      - name: Verify ESPN player identities
        run: python fpl_player_verify.py
  
      - name: Match ESPN players with FPL V3
        run: python fpl_espn_match_v3.py
      
      - name: Generate player review candidates
        run: python fpl_player_review.py

      - name: Match ESPN players with FPL V4
        run: python fpl_espn_match_v4.py
      - name: Audit ESPN and FPL player identities
        run: python fpl_identity_audit.py
 
      - name: Verify ESPN player IDs in match summaries
        run: python fpl_espn_identity_verify.py
       
      - name: Crosscheck ESPN lineups against FPL minutes
        run: python fpl_minutes_crosscheck.py

      - name: Audit ESPN starting XI against FPL
        run: python fpl_starting_xi_audit.py

      - name: Calculate starting XI stability
        run: python fpl_starter_stability.py
      - name: Analyze real player positions
        run: python fpl_position_analysis.py
      - name: Validate ESPN formation positions
        run: python fpl_position_validation.py
      - name: Calculate FPL player value ranking
        run: python fpl_value_ranking.py
      - name: Analyze personal FPL transfers
        run: python fpl_personal_transfers.py 
      - name: Track elite FPL managers
        run: python fpl_elite100.py   
      - name: Backfill elite manager history
        run: python fpl_elite_history.py  
        
      - name: Pilot random FPL control sampling
        run: python fpl_control_sample.py

      - name: Validate random FPL sample
        run: python fpl_control_validation.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update FPL data"
            git push
          fi
